<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BuildFlow AI — Chat Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#0D1B2A;
  --navy-mid:#1A2E42;
  --navy-light:#243B55;
  --amber:#F4A228;
  --amber-lt:#FBBF58;
  --amber-dim:rgba(244,162,40,0.12);
  --amber-glow:rgba(244,162,40,0.3);
  --white:#FFFFFF;
  --gray-100:#EAE7E1;
  --gray-300:#B8B4AC;
  --gray-500:#6E6A63;
  --green:#22C55E;
  --r:8px;
  --r-lg:16px;
  --r-xl:24px;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--navy);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow-x:hidden;
}

/* ── DEMO PAGE BG ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
  z-index:0;
}

.demo-wrapper{
  position:relative;z-index:1;
  width:100%;max-width:480px;
  display:flex;flex-direction:column;
  align-items:center;gap:20px;
}

.demo-label{
  text-align:center;
  font-size:0.75rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--gray-500);
}

/* ── CHAT WIDGET ── */
.chat-widget{
  width:100%;
  background:var(--navy-mid);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--r-xl);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 32px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(244,162,40,0.08);
  height:620px;
  position:relative;
}

/* ── HEADER ── */
.chat-header{
  background:linear-gradient(135deg,var(--navy-light),var(--navy-mid));
  border-bottom:1px solid rgba(255,255,255,0.07);
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}

.avatar{
  width:40px;height:40px;
  background:var(--amber);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  position:relative;
}

.avatar svg{width:20px;height:20px;}

.status-dot{
  position:absolute;
  bottom:-2px;right:-2px;
  width:11px;height:11px;
  background:var(--green);
  border:2px solid var(--navy-mid);
  border-radius:50%;
  animation:pulse-dot 2s ease infinite;
}

@keyframes pulse-dot{
  0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.4)}
  50%{box-shadow:0 0 0 4px rgba(34,197,94,0)}
}

.header-info{flex:1;}
.header-name{
  font-family:'Syne',sans-serif;
  font-weight:700;font-size:0.95rem;
  color:var(--white);letter-spacing:-0.01em;
}
.header-sub{font-size:0.72rem;color:var(--green);margin-top:1px;}

.header-actions{display:flex;gap:8px;}
.icon-btn{
  width:32px;height:32px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--gray-300);
  transition:background 0.2s,color 0.2s;
}
.icon-btn:hover{background:rgba(255,255,255,0.1);color:var(--white);}
.icon-btn svg{width:15px;height:15px;}

/* ── MESSAGES ── */
.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  gap:16px;
  scroll-behavior:smooth;
}

.chat-messages::-webkit-scrollbar{width:3px;}
.chat-messages::-webkit-scrollbar-track{background:transparent;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}

/* Message groups */
.msg-group{display:flex;gap:10px;align-items:flex-end;animation:msgIn 0.3s ease both;}

@keyframes msgIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.msg-group.user{flex-direction:row-reverse;}

.msg-avatar{
  width:28px;height:28px;
  border-radius:8px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:0.65rem;font-weight:700;
  font-family:'Syne',sans-serif;
}

.msg-avatar.bot{background:var(--amber);color:var(--navy);}
.msg-avatar.user{background:rgba(255,255,255,0.1);color:var(--gray-300);}

.msg-bubble{
  max-width:calc(100% - 80px);
  padding:12px 14px;
  border-radius:16px;
  font-size:0.875rem;
  line-height:1.6;
  position:relative;
}

.msg-group.bot .msg-bubble{
  background:var(--navy-light);
  border:1px solid rgba(255,255,255,0.07);
  color:var(--gray-100);
  border-bottom-left-radius:4px;
}

.msg-group.user .msg-bubble{
  background:var(--amber);
  color:var(--navy);
  font-weight:500;
  border-bottom-right-radius:4px;
}

.msg-bubble p{margin:0 0 8px;}
.msg-bubble p:last-child{margin:0;}
.msg-bubble strong{color:var(--white);}
.msg-group.user .msg-bubble strong{color:var(--navy);}
.msg-bubble ul{margin:6px 0 6px 16px;}
.msg-bubble li{margin-bottom:4px;}

.msg-time{
  font-size:0.62rem;
  color:var(--gray-500);
  margin-top:4px;
  padding:0 4px;
}
.msg-group.user .msg-time{text-align:right;}

/* Typing indicator */
.typing-indicator{
  display:flex;gap:10px;align-items:flex-end;
}
.typing-dots{
  background:var(--navy-light);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;border-bottom-left-radius:4px;
  padding:14px 18px;
  display:flex;gap:5px;align-items:center;
}
.typing-dots span{
  width:6px;height:6px;
  background:var(--gray-500);
  border-radius:50%;
  animation:bounce 1.2s ease infinite;
}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{
  0%,60%,100%{transform:translateY(0)}
  30%{transform:translateY(-5px)}
}

/* Quick replies */
.quick-replies{
  padding:0 16px 12px;
  display:flex;flex-wrap:wrap;gap:8px;
  flex-shrink:0;
}

.qr-btn{
  background:transparent;
  border:1px solid rgba(244,162,40,0.3);
  color:var(--amber);
  font-family:'DM Sans',sans-serif;
  font-size:0.78rem;
  font-weight:500;
  padding:6px 12px;
  border-radius:100px;
  cursor:pointer;
  transition:background 0.2s,border-color 0.2s,transform 0.1s;
  white-space:nowrap;
}
.qr-btn:hover{
  background:var(--amber-dim);
  border-color:var(--amber);
  transform:translateY(-1px);
}

/* ── INPUT AREA ── */
.chat-input-area{
  border-top:1px solid rgba(255,255,255,0.06);
  padding:12px 16px;
  display:flex;
  gap:8px;
  align-items:flex-end;
  flex-shrink:0;
  background:rgba(0,0,0,0.15);
}

.input-wrapper{
  flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  display:flex;
  align-items:flex-end;
  padding:10px 14px;
  transition:border-color 0.2s,background 0.2s;
  min-height:44px;
}
.input-wrapper:focus-within{
  border-color:rgba(244,162,40,0.4);
  background:rgba(255,255,255,0.08);
}

#chat-input{
  flex:1;
  background:transparent;
  border:none;outline:none;
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:0.875rem;
  resize:none;
  max-height:120px;
  line-height:1.5;
  overflow-y:auto;
}
#chat-input::placeholder{color:var(--gray-500);}
#chat-input::-webkit-scrollbar{display:none;}

.send-btn{
  width:44px;height:44px;
  background:var(--amber);
  border:none;border-radius:12px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background 0.2s,transform 0.1s,box-shadow 0.2s;
}
.send-btn:hover{
  background:var(--amber-lt);
  transform:translateY(-1px);
  box-shadow:0 4px 16px rgba(244,162,40,0.3);
}
.send-btn:active{transform:scale(0.95);}
.send-btn:disabled{background:rgba(255,255,255,0.1);cursor:not-allowed;transform:none;box-shadow:none;}
.send-btn svg{width:18px;height:18px;color:var(--navy);}

.chat-footer{
  text-align:center;
  padding:8px 16px 10px;
  font-size:0.65rem;
  color:var(--gray-500);
  border-top:1px solid rgba(255,255,255,0.04);
  flex-shrink:0;
}

/* ── FLOATING TRIGGER (for embedding) ── */
.chat-trigger{
  position:fixed;
  bottom:28px;right:28px;
  width:60px;height:60px;
  background:var(--amber);
  border-radius:50%;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 30px rgba(244,162,40,0.4);
  transition:transform 0.2s,box-shadow 0.2s;
  z-index:9999;
  display:none;
}
.chat-trigger:hover{transform:scale(1.08);box-shadow:0 12px 40px rgba(244,162,40,0.5);}
.chat-trigger svg{width:26px;height:26px;color:var(--navy);}

.notification-badge{
  position:absolute;top:-4px;right:-4px;
  width:20px;height:20px;
  background:#EF4444;
  border-radius:50%;
  border:2px solid var(--navy);
  display:flex;align-items:center;justify-content:center;
  font-size:0.6rem;font-weight:700;color:white;
}

/* Embed snippet box */
.embed-box{
  width:100%;
  background:rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:12px;
  padding:16px 20px;
}
.embed-box p{font-size:0.75rem;color:var(--gray-500);margin-bottom:8px;}
.embed-box code{
  display:block;
  font-family:monospace;
  font-size:0.72rem;
  color:var(--amber);
  line-height:1.6;
  word-break:break-all;
}

/* Markdown rendering in bot messages */
.msg-bubble a{color:var(--amber);text-decoration:underline;}
.msg-bubble code{
  background:rgba(0,0,0,0.3);
  padding:2px 6px;
  border-radius:4px;
  font-size:0.8em;
  font-family:monospace;
}
</style>
</head>
<body>

<div class="demo-wrapper">
  <p class="demo-label">BuildFlow · Chat widget preview</p>

  <div class="chat-widget" id="chat-widget">

    <!-- Header -->
    <div class="chat-header">
      <div class="avatar">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="9" width="7" height="10" rx="1.5" fill="#0D1B2A"/>
          <rect x="12" y="4" width="7" height="15" rx="1.5" fill="#0D1B2A"/>
          <rect x="1" y="1" width="7" height="6" rx="1.5" fill="#0D1B2A" opacity="0.4"/>
        </svg>
        <div class="status-dot"></div>
      </div>
      <div class="header-info">
        <div class="header-name">BuildFlow Support</div>
        <div class="header-sub">● Online · typical reply under a minute</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="clearChat()" title="Clear chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.14"/></svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chat-messages"></div>

    <!-- Quick Replies -->
    <div class="quick-replies" id="quick-replies">
      <button class="qr-btn" onclick="sendQuick('How does BuildFlow work?')">How it works</button>
      <button class="qr-btn" onclick="sendQuick('What does it cost?')">Pricing</button>
      <button class="qr-btn" onclick="sendQuick('How much time does it actually save?')">Time savings</button>
      <button class="qr-btn" onclick="sendQuick('How do I start a free trial?')">Free trial</button>
      <button class="qr-btn" onclick="sendQuick('What does setup look like?')">Setup</button>
      <button class="qr-btn" onclick="sendQuick('What blueprint formats are supported?')">Supported files</button>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <div class="input-wrapper">
        <textarea id="chat-input" placeholder="Ask a question about BuildFlow…" rows="1"></textarea>
      </div>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <div class="chat-footer">BuildFlow · M Systems AI · Conversations are not shared with third parties</div>
  </div>

  <div class="embed-box">
    <p>To embed this widget on your site, paste before &lt;/body&gt;:</p>
    <code>&lt;script src="https://buildflow.ai/chat-widget.js"&gt;&lt;/script&gt;</code>
  </div>
</div>

<script>
// ── SYSTEM PROMPT — the brain of the bot ──────────────────────────────────
const SYSTEM_PROMPT = `You are a support representative for BuildFlow, embedded on the BuildFlow website. Your job is to answer questions from contractors evaluating the product — clearly, honestly, and without sales theatrics. If a question maps to the trial or a conversation with the team, point them there at the end of your answer. Do not push.

================================================================
HOW YOU WRITE (read this carefully — most of your output errors will come from ignoring it)
================================================================

You sound like a competent person at a small company. You do not sound like a chatbot. Concretely:

- No opening pleasantries. Do not start with "Great question," "I'd be happy to," "Absolutely!", "Of course!", or any variation. Just answer.
- No emojis. None. Not even in greetings.
- No exclamation marks unless the customer used one first and the situation truly warrants it.
- No filler phrases: "feel free to," "don't hesitate to," "I hope this helps," "let me know if you have any other questions."
- No restating the question back at the customer before answering.
- Default to plain sentences. Use a bulleted list only when the answer is genuinely a list of 3+ items. Two-item lists should be prose.
- Keep most replies to 2–4 sentences. Go longer only when the question genuinely requires it (e.g. pricing breakdown, comparison to a competitor).
- Use "you" and "we." Not "our users," not "our valued customers."
- Em dashes are fine sparingly. Don't sprinkle them.
- Don't bold things for emphasis inside running prose. Bold is for the email address (hello@msystemsai.com) and for plan names in a pricing reply.
- Don't end every reply with a follow-up question. End with one only when it actually moves the conversation forward.
- Don't name-drop the underlying AI vendors (OpenAI, GPT, Claude, Anthropic, n8n, SendGrid, AWS) to customers. Say "vision model" or "the platform" or "our backend." If a customer specifically asks what's under the hood, you can answer plainly, but never volunteer it.
- If you don't know, say "I don't know — the fastest answer is hello@msystemsai.com." Don't invent.
- Don't oversell. No "revolutionary," "game-changing," "powerful," "seamless," or "cutting-edge." Describe what it does.

================================================================
COMPANY FACTS
================================================================

BuildFlow is built by M Systems AI, based in Lawrence, Kansas. The founder is a University of Kansas student running the company while in school and personally handles onboarding for every customer right now.

The product is in private beta. We are actively enrolling a small group of design partners through the end of 2026. Design partners get free access during the beta and a direct line into what we build next.

================================================================
WHAT THE PRODUCT DOES
================================================================

BuildFlow is a web platform that handles the work between a blueprint and a project schedule. It replaces the manual cycle that small and mid-market general contractors currently run through email, spreadsheets, and Excel.

The cycle, end to end:

1. The contractor uploads a blueprint PDF or scope document (up to 50MB).
2. A vision model reads the drawings and returns a structured list of scope line items — partitions, MEP, finishes, etc. — usually in under five seconds. The contractor reviews and edits the list before anything goes out.
3. The platform drafts a bid request email for each scope, addressed to the right subcontractor. The contractor approves the batch before it sends.
4. As subs reply, the dashboard shows received, pending, and overdue bids. Follow-up emails go out automatically at 48 hours, at 24 hours, and after the deadline.
5. Once bids are confirmed, the platform produces a phased project schedule with dependencies. Export to Google Sheets, CSV, or PDF.

Accuracy on standard blueprint formats is around 90%. Anything the model is unsure about is flagged for review rather than silently passed through. Early customers get a human review pass on their first projects.

================================================================
PRICING (source of truth)
================================================================

- **Starter — $75 per project.** Pay per project, no monthly commitment. Includes blueprint parsing, drafted bid request emails, the response dashboard, deadline reminders, and CSV/PDF schedule export.
- **Monthly Unlimited — $400/month.** Unlimited projects. Adds priority processing, inbox routing for bid responses, Google Sheets and Calendar sync, SMS deadline reminders, and an onboarding call.
- **Annual billing — $4,000/year** (two months free vs. monthly).
- **Free trial — 7 days, no credit card.** Run a real project through it.
- **Larger firms (50+ employees):** custom pricing, contact us.

================================================================
TYPICAL ROI
================================================================

Assume a project manager spending 8 hours a week on bid tracking, schedule building, and follow-ups, at a loaded labor cost of $50/hour. That's roughly $1,700/month per PM. The Monthly Unlimited plan is $400, so a single PM running through BuildFlow typically frees up several thousand dollars a month in time. Two-PM shops see more.

These are estimates from the workflow itself, not measured case studies. Be honest about that if asked.

================================================================
WHO IT'S BUILT FOR
================================================================

Best fit:
- General contractors with 5–50 employees and 2–15 active projects
- Specialty subcontractors (electrical, plumbing, HVAC, framing, drywall, roofing, concrete, insulation) handling high bid volume into multiple GCs
- Annual revenue roughly $2M–$50M

The owner-operator and the growing GC tend to feel the time savings most immediately. Specialty subs use it more for response speed and never missing an incoming bid deadline.

Not the right fit:
- Very large enterprise GCs already on Procore-class systems
- Solo handymen / one-project-a-year operations

================================================================
HOW IT COMPARES TO WHAT ELSE IS OUT THERE
================================================================

- Togal.AI is focused on takeoffs and measurements. BuildFlow goes further into bid tracking and schedule generation.
- Downtobid handles bid invitations and sub management. BuildFlow also produces the project schedule once bids are confirmed.
- Buildr is a precon CRM aimed at larger firms with custom pricing. BuildFlow starts at $75/project, no contract.
- STACK is cloud estimating. BuildFlow is specifically for the bid-tracking and scheduling work that happens after takeoffs.
- Procore is an enterprise platform. BuildFlow is built for the smaller GC where Procore is too expensive or too heavy.

When asked about a competitor, be respectful — these are real products. Just describe what BuildFlow does that's different.

================================================================
COMMON QUESTIONS — REFERENCE ANSWERS
================================================================

These are the substance to draw from. Write in your own voice; don't read them verbatim.

How does it work? — Walk them through the five-step cycle above, briefly. Two or three sentences, not a numbered list unless they ask for one.

What does it cost? — Two plans: $75 per project, or $400/month unlimited. Mention the 7-day trial.

Is there a free trial? — 7 days, no credit card. They run it on a real project.

How accurate is the blueprint parsing? — Around 90% on standard formats. Uncertain items are flagged. The contractor reviews and edits before anything is sent.

What blueprints work? — Standard PDF blueprints and scope documents up to 50MB. Residential, commercial, and specialty trade documents.

How hard is setup? — Upload a blueprint. There's no IT work and no required integrations to start. Onboarding call included on the Monthly plan and during the trial.

What if subs don't respond? — Follow-up reminders go out at 48 hours and 24 hours before the deadline, and again after. You also get an in-dashboard alert when a bid is overdue.

Does it integrate with Procore / QuickBooks / etc.? — Google Sheets and Calendar sync are live. QuickBooks and a couple of others are on the roadmap. Schedules export to CSV and PDF today.

How is this different from just using email? — Email doesn't track anything. BuildFlow logs every request, watches every reply, and surfaces what's late.

Is my data secure? — Files are stored encrypted in our cloud storage. They are not shared with third parties and are not used to train any AI models. Each customer's data is isolated.

What size company is this for? — Best fit is 5–50 employees. Owner-operators and growing GCs both benefit.

How do I know it'll work for me? — That's a fair question to ask. Best answer is to run one real project through the 7-day trial. No card required, and the founder does the onboarding call personally.

Can I cancel? — Yes. No contracts on the monthly plan and no cancellation fees.

How do I sign up? — Enter your email on the page or write to hello@msystemsai.com. The founder follows up personally, usually within a business day.

Who built this? — M Systems AI, founded by a University of Kansas student. The founder is doing all of the early sales and onboarding directly.

Is this for GCs or subs? — Both. GCs use it for outgoing bid requests. Specialty subs use it to track incoming bid requests from multiple GCs and stay on top of deadlines.

================================================================
HANDLING SKEPTICISM AND OBJECTIONS
================================================================

When someone is skeptical, don't get defensive and don't oversell. Acknowledge the concern in one short sentence, give them a concrete fact, and offer a low-commitment next step (usually the trial or a call). Example shape, in your own words: "Fair concern. The trial is set up exactly for this — run one project, see what comes out, no card required."

If they ask something the documentation above doesn't cover, do not guess. Say you'd rather not speculate and point them at hello@msystemsai.com.

================================================================
WHAT TO DO AT THE END OF A REPLY
================================================================

Usually nothing — just end the answer. Add a single next step only when it's actually helpful:
- If they're clearly evaluating: mention the trial.
- If they're asking something specific that needs a human: point at hello@msystemsai.com.
- If they're just curious: leave the conversation open without a forced CTA.`;

// ── STATE ────────────────────────────────────────────────────────────────
let conversationHistory = [];
let isTyping = false;

// ── INIT ─────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  addBotMessage("Hi, I'm here to answer questions about BuildFlow — how it works, pricing, setup, or how it would fit your shop. Ask whatever's useful.");
  setupInput();
});

function setupInput() {
  const input = document.getElementById('chat-input');
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
}

// ── SEND MESSAGE ──────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || isTyping) return;

  input.value = '';
  input.style.height = 'auto';
  hideQuickReplies();

  addUserMessage(text);
  conversationHistory.push({ role: 'user', content: text });

  showTyping();
  setSendDisabled(true);

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    hideTyping();

    if (data.content && data.content[0] && data.content[0].text) {
      const reply = data.content[0].text;
      conversationHistory.push({ role: 'assistant', content: reply });
      addBotMessage(reply);
    } else if (data.error) {
      addBotMessage("Sorry, I can't reach the server right now. For anything time-sensitive, email **hello@msystemsai.com** and we'll get back to you within a business day.");
    }
  } catch (err) {
    hideTyping();
    addBotMessage("Connection issue on my end. The fastest way to reach the team is **hello@msystemsai.com**, or leave your email in the form on the page and we'll follow up.");
  }

  setSendDisabled(false);
  document.getElementById('chat-input').focus();
}

function sendQuick(text) {
  document.getElementById('chat-input').value = text;
  sendMessage();
}

// ── MESSAGE RENDERING ─────────────────────────────────────────────────────
function addBotMessage(text) {
  const messages = document.getElementById('chat-messages');
  const now = getTime();

  const group = document.createElement('div');
  group.className = 'msg-group bot';

  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar bot';
  avatarEl.textContent = 'BF';

  const right = document.createElement('div');

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = renderMarkdown(text);

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = now;

  right.appendChild(bubble);
  right.appendChild(time);
  group.appendChild(avatarEl);
  group.appendChild(right);
  messages.appendChild(group);
  scrollToBottom();
}

function addUserMessage(text) {
  const messages = document.getElementById('chat-messages');
  const now = getTime();

  const group = document.createElement('div');
  group.className = 'msg-group user';

  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar user';
  avatarEl.textContent = 'You';

  const left = document.createElement('div');

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = now;

  left.appendChild(bubble);
  left.appendChild(time);
  group.appendChild(left);
  group.appendChild(avatarEl);
  messages.appendChild(group);
  scrollToBottom();
}

// ── TYPING INDICATOR ──────────────────────────────────────────────────────
function showTyping() {
  isTyping = true;
  const messages = document.getElementById('chat-messages');
  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  indicator.id = 'typing-indicator';

  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar bot';
  avatarEl.textContent = 'BF';

  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';

  indicator.appendChild(avatarEl);
  indicator.appendChild(dots);
  messages.appendChild(indicator);
  scrollToBottom();
}

function hideTyping() {
  isTyping = false;
  const indicator = document.getElementById('typing-indicator');
  if (indicator) indicator.remove();
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function scrollToBottom() {
  const messages = document.getElementById('chat-messages');
  messages.scrollTop = messages.scrollHeight;
}

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function setSendDisabled(disabled) {
  document.getElementById('send-btn').disabled = disabled;
}

function hideQuickReplies() {
  const qr = document.getElementById('quick-replies');
  if (qr && conversationHistory.length > 0) {
    qr.style.display = 'none';
  }
}

function clearChat() {
  conversationHistory = [];
  document.getElementById('chat-messages').innerHTML = '';
  const qr = document.getElementById('quick-replies');
  if (qr) qr.style.display = 'flex';
  addBotMessage("Chat cleared. What can I help you with?");
}

// ── MARKDOWN RENDERER ─────────────────────────────────────────────────────
function renderMarkdown(text) {
  return text
    // Bold
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    // Italic
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    // Code
    .replace(/`(.*?)`/g, '<code>$1</code>')
    // Bullet lists
    .replace(/^[-•]\s(.+)$/gm, '<li>$1</li>')
    // Numbered lists
    .replace(/^\d+\.\s(.+)$/gm, '<li>$1</li>')
    // Wrap consecutive <li> items
    .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
    // Double newlines = paragraphs
    .replace(/\n\n/g, '</p><p>')
    // Single newlines within paragraphs
    .replace(/\n/g, '<br/>')
    // Wrap in paragraph
    .replace(/^(.+)$/, '<p>$1</p>');
}
