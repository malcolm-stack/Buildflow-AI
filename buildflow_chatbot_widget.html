<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BuildFlow AI — Chat Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#0D1B2A;
  --navy-mid:#1A2E42;
  --navy-light:#243B55;
  --amber:#F4A228;
  --amber-lt:#FBBF58;
  --amber-dim:rgba(244,162,40,0.12);
  --amber-glow:rgba(244,162,40,0.3);
  --white:#FFFFFF;
  --gray-100:#EAE7E1;
  --gray-300:#B8B4AC;
  --gray-500:#6E6A63;
  --green:#22C55E;
  --r:8px;
  --r-lg:16px;
  --r-xl:24px;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--navy);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow-x:hidden;
}

/* ── DEMO PAGE BG ── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
  z-index:0;
}

.demo-wrapper{
  position:relative;z-index:1;
  width:100%;max-width:480px;
  display:flex;flex-direction:column;
  align-items:center;gap:20px;
}

.demo-label{
  text-align:center;
  font-size:0.75rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--gray-500);
}

/* ── CHAT WIDGET ── */
.chat-widget{
  width:100%;
  background:var(--navy-mid);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--r-xl);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 32px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(244,162,40,0.08);
  height:620px;
  position:relative;
}

/* ── HEADER ── */
.chat-header{
  background:linear-gradient(135deg,var(--navy-light),var(--navy-mid));
  border-bottom:1px solid rgba(255,255,255,0.07);
  padding:16px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
}

.avatar{
  width:40px;height:40px;
  background:var(--amber);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  position:relative;
}

.avatar svg{width:20px;height:20px;}

.status-dot{
  position:absolute;
  bottom:-2px;right:-2px;
  width:11px;height:11px;
  background:var(--green);
  border:2px solid var(--navy-mid);
  border-radius:50%;
  animation:pulse-dot 2s ease infinite;
}

@keyframes pulse-dot{
  0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.4)}
  50%{box-shadow:0 0 0 4px rgba(34,197,94,0)}
}

.header-info{flex:1;}
.header-name{
  font-family:'Syne',sans-serif;
  font-weight:700;font-size:0.95rem;
  color:var(--white);letter-spacing:-0.01em;
}
.header-sub{font-size:0.72rem;color:var(--green);margin-top:1px;}

.header-actions{display:flex;gap:8px;}
.icon-btn{
  width:32px;height:32px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--gray-300);
  transition:background 0.2s,color 0.2s;
}
.icon-btn:hover{background:rgba(255,255,255,0.1);color:var(--white);}
.icon-btn svg{width:15px;height:15px;}

/* ── MESSAGES ── */
.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:20px 16px;
  display:flex;
  flex-direction:column;
  gap:16px;
  scroll-behavior:smooth;
}

.chat-messages::-webkit-scrollbar{width:3px;}
.chat-messages::-webkit-scrollbar-track{background:transparent;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}

/* Message groups */
.msg-group{display:flex;gap:10px;align-items:flex-end;animation:msgIn 0.3s ease both;}

@keyframes msgIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.msg-group.user{flex-direction:row-reverse;}

.msg-avatar{
  width:28px;height:28px;
  border-radius:8px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:0.65rem;font-weight:700;
  font-family:'Syne',sans-serif;
}

.msg-avatar.bot{background:var(--amber);color:var(--navy);}
.msg-avatar.user{background:rgba(255,255,255,0.1);color:var(--gray-300);}

.msg-bubble{
  max-width:calc(100% - 80px);
  padding:12px 14px;
  border-radius:16px;
  font-size:0.875rem;
  line-height:1.6;
  position:relative;
}

.msg-group.bot .msg-bubble{
  background:var(--navy-light);
  border:1px solid rgba(255,255,255,0.07);
  color:var(--gray-100);
  border-bottom-left-radius:4px;
}

.msg-group.user .msg-bubble{
  background:var(--amber);
  color:var(--navy);
  font-weight:500;
  border-bottom-right-radius:4px;
}

.msg-bubble p{margin:0 0 8px;}
.msg-bubble p:last-child{margin:0;}
.msg-bubble strong{color:var(--white);}
.msg-group.user .msg-bubble strong{color:var(--navy);}
.msg-bubble ul{margin:6px 0 6px 16px;}
.msg-bubble li{margin-bottom:4px;}

.msg-time{
  font-size:0.62rem;
  color:var(--gray-500);
  margin-top:4px;
  padding:0 4px;
}
.msg-group.user .msg-time{text-align:right;}

/* Typing indicator */
.typing-indicator{
  display:flex;gap:10px;align-items:flex-end;
}
.typing-dots{
  background:var(--navy-light);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;border-bottom-left-radius:4px;
  padding:14px 18px;
  display:flex;gap:5px;align-items:center;
}
.typing-dots span{
  width:6px;height:6px;
  background:var(--gray-500);
  border-radius:50%;
  animation:bounce 1.2s ease infinite;
}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{
  0%,60%,100%{transform:translateY(0)}
  30%{transform:translateY(-5px)}
}

/* Quick replies */
.quick-replies{
  padding:0 16px 12px;
  display:flex;flex-wrap:wrap;gap:8px;
  flex-shrink:0;
}

.qr-btn{
  background:transparent;
  border:1px solid rgba(244,162,40,0.3);
  color:var(--amber);
  font-family:'DM Sans',sans-serif;
  font-size:0.78rem;
  font-weight:500;
  padding:6px 12px;
  border-radius:100px;
  cursor:pointer;
  transition:background 0.2s,border-color 0.2s,transform 0.1s;
  white-space:nowrap;
}
.qr-btn:hover{
  background:var(--amber-dim);
  border-color:var(--amber);
  transform:translateY(-1px);
}

/* ── INPUT AREA ── */
.chat-input-area{
  border-top:1px solid rgba(255,255,255,0.06);
  padding:12px 16px;
  display:flex;
  gap:8px;
  align-items:flex-end;
  flex-shrink:0;
  background:rgba(0,0,0,0.15);
}

.input-wrapper{
  flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  display:flex;
  align-items:flex-end;
  padding:10px 14px;
  transition:border-color 0.2s,background 0.2s;
  min-height:44px;
}
.input-wrapper:focus-within{
  border-color:rgba(244,162,40,0.4);
  background:rgba(255,255,255,0.08);
}

#chat-input{
  flex:1;
  background:transparent;
  border:none;outline:none;
  color:var(--white);
  font-family:'DM Sans',sans-serif;
  font-size:0.875rem;
  resize:none;
  max-height:120px;
  line-height:1.5;
  overflow-y:auto;
}
#chat-input::placeholder{color:var(--gray-500);}
#chat-input::-webkit-scrollbar{display:none;}

.send-btn{
  width:44px;height:44px;
  background:var(--amber);
  border:none;border-radius:12px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:background 0.2s,transform 0.1s,box-shadow 0.2s;
}
.send-btn:hover{
  background:var(--amber-lt);
  transform:translateY(-1px);
  box-shadow:0 4px 16px rgba(244,162,40,0.3);
}
.send-btn:active{transform:scale(0.95);}
.send-btn:disabled{background:rgba(255,255,255,0.1);cursor:not-allowed;transform:none;box-shadow:none;}
.send-btn svg{width:18px;height:18px;color:var(--navy);}

.chat-footer{
  text-align:center;
  padding:8px 16px 10px;
  font-size:0.65rem;
  color:var(--gray-500);
  border-top:1px solid rgba(255,255,255,0.04);
  flex-shrink:0;
}

/* ── FLOATING TRIGGER (for embedding) ── */
.chat-trigger{
  position:fixed;
  bottom:28px;right:28px;
  width:60px;height:60px;
  background:var(--amber);
  border-radius:50%;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 30px rgba(244,162,40,0.4);
  transition:transform 0.2s,box-shadow 0.2s;
  z-index:9999;
  display:none;
}
.chat-trigger:hover{transform:scale(1.08);box-shadow:0 12px 40px rgba(244,162,40,0.5);}
.chat-trigger svg{width:26px;height:26px;color:var(--navy);}

.notification-badge{
  position:absolute;top:-4px;right:-4px;
  width:20px;height:20px;
  background:#EF4444;
  border-radius:50%;
  border:2px solid var(--navy);
  display:flex;align-items:center;justify-content:center;
  font-size:0.6rem;font-weight:700;color:white;
}

/* Embed snippet box */
.embed-box{
  width:100%;
  background:rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:12px;
  padding:16px 20px;
}
.embed-box p{font-size:0.75rem;color:var(--gray-500);margin-bottom:8px;}
.embed-box code{
  display:block;
  font-family:monospace;
  font-size:0.72rem;
  color:var(--amber);
  line-height:1.6;
  word-break:break-all;
}

/* Markdown rendering in bot messages */
.msg-bubble a{color:var(--amber);text-decoration:underline;}
.msg-bubble code{
  background:rgba(0,0,0,0.3);
  padding:2px 6px;
  border-radius:4px;
  font-size:0.8em;
  font-family:monospace;
}
</style>
</head>
<body>

<div class="demo-wrapper">
  <p class="demo-label">BuildFlow AI — Live Chat Widget Preview</p>

  <div class="chat-widget" id="chat-widget">

    <!-- Header -->
    <div class="chat-header">
      <div class="avatar">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="9" width="7" height="10" rx="1.5" fill="#0D1B2A"/>
          <rect x="12" y="4" width="7" height="15" rx="1.5" fill="#0D1B2A"/>
          <rect x="1" y="1" width="7" height="6" rx="1.5" fill="#0D1B2A" opacity="0.4"/>
        </svg>
        <div class="status-dot"></div>
      </div>
      <div class="header-info">
        <div class="header-name">BuildFlow AI Assistant</div>
        <div class="header-sub">● Online — replies instantly</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="clearChat()" title="Clear chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.14"/></svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chat-messages"></div>

    <!-- Quick Replies -->
    <div class="quick-replies" id="quick-replies">
      <button class="qr-btn" onclick="sendQuick('How does BuildFlow work?')">How does it work?</button>
      <button class="qr-btn" onclick="sendQuick('What does it cost?')">Pricing</button>
      <button class="qr-btn" onclick="sendQuick('How much time will I actually save?')">Time savings</button>
      <button class="qr-btn" onclick="sendQuick('I want to try it free')">Free trial</button>
      <button class="qr-btn" onclick="sendQuick('Is it hard to set up?')">Setup</button>
      <button class="qr-btn" onclick="sendQuick('What types of blueprints can you read?')">Blueprints</button>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <div class="input-wrapper">
        <textarea id="chat-input" placeholder="Ask anything about BuildFlow AI…" rows="1"></textarea>
      </div>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <div class="chat-footer">Powered by BuildFlow AI · Your info is never shared</div>
  </div>

  <div class="embed-box">
    <p>📋 To embed this chatbot on your landing page, paste before &lt;/body&gt;:</p>
    <code>&lt;script src="https://buildflow.ai/chat-widget.js"&gt;&lt;/script&gt;</code>
  </div>
</div>

<script>
// ── SYSTEM PROMPT — the brain of the bot ──────────────────────────────────
const SYSTEM_PROMPT = `You are the BuildFlow AI sales and support assistant, embedded on the BuildFlow AI landing page. Your job is to answer every question a visiting contractor might have — and to help them understand the product, handle their objections, and get them to sign up for a free trial.

You are warm, direct, and knowledgeable. You talk like a real person, not a corporate chatbot. You are never pushy but always helpful. You use short paragraphs and bullet points when needed. You keep answers concise — 2-4 sentences for simple questions, a bit longer for complex ones. Never write walls of text.

---

ABOUT BUILDFLOW AI:

Company: BuildFlow AI, a product of M Systems AI (Lawrence, KS)
Founder: College student at University of Kansas, building this while in school
Stage: Pre-revenue beta — actively signing design partners

WHAT IT IS:
BuildFlow AI is a web-based platform that automates the entire bid-to-schedule workflow for small to mid-market construction contractors. Instead of spending 5–10 hours per week manually reading blueprints, writing bid emails, chasing subcontractors, and building schedules in Excel, contractors upload a blueprint and BuildFlow handles everything.

THE 5-STEP WORKFLOW:
1. Contractor uploads a blueprint PDF or project spec
2. AI (GPT-4o Vision) extracts all line items automatically (drywall, electrical, plumbing, etc.) in under 5 seconds
3. AI drafts professional bid request emails for each subcontractor trade
4. System tracks bid responses in real-time — shows who responded, who's pending, who's late — and sends automated follow-up reminders
5. AI generates a project schedule from confirmed bids and exports it to Google Sheets, CSV, or PDF

FEATURES:
- Blueprint Parser: GPT-4o Vision reads any PDF blueprint, 90%+ accuracy, <5 second processing
- Bid Email Generator: Claude AI drafts professional bid request emails for each sub trade
- Live Bid Tracker: Dashboard showing every bid's status across all projects in real-time
- Deadline Alert System: Automated alerts at 48 hours, 24 hours, and when a bid goes late
- Project Schedule Generator: AI builds Gantt chart / schedule from confirmed bids, exports in seconds
- Email Triage Assistant: n8n workflow monitors inbox, routes bid responses automatically, drafts replies to sub questions

TECH STACK: React + TailwindCSS frontend, FastAPI backend, GPT-4o Vision (blueprint parsing), Claude Sonnet (email generation + schedule logic), SendGrid (email delivery), AWS S3 (file storage), n8n (workflow automation)

PRICING (official, source of truth):
- Phase 1 — Per Project: $75 per project. No monthly commitment. Pay per project processed.
- Phase 2 — Monthly Unlimited: $400/month. Unlimited projects. All features included.
- Annual discount: $3,840/year (2 months free vs. monthly)
- Free trial: 7 days, no credit card required
- Enterprise: Custom pricing for firms with 50+ employees

ROI / VALUE:
- Average contractor saves 8–10 hours per week per project manager
- At $50/hour loaded labor cost: saves $1,600–$2,000/month per PM
- BuildFlow costs $400/month
- Net savings: $1,200–$1,600/month = 3x–5x ROI
- Annual ROI for small contractor: $12,000–$18,000 saved vs. $4,800 spent

CASE STUDIES (projected based on workflow automation):
- Small contractor (5–10 employees): 8 hrs/week → 1 hr/week, saves $350/week, ROI = 3x
- Mid-market contractor (20–50 employees, 2 PMs): 20 hrs/week → 4 hrs/week, saves $600/week, ROI = 5.4x

TARGET CUSTOMERS:
- Small to mid-market general contractors (5–50 employees)
- Specialty subs: electrical, plumbing, HVAC, framing, drywall, roofing, concrete, insulation
- Annual revenue: $2M–$50M
- Pain: manual bid tracking via email and spreadsheets, missed deadlines, no centralized system

COMPETITIVE ADVANTAGE vs. others:
- Togal.AI: focuses on AI takeoffs/measurements. BuildFlow focuses on scheduling, not just measurements.
- Downtobid: bid invitation and sub management at ~$150/mo. BuildFlow automates schedule creation FROM the bid.
- Buildr: CRM and precon management, custom/enterprise pricing. BuildFlow is more accessible at $75/project.
- STACK: cloud estimating. BuildFlow is specifically the "bid-to-schedule" AI engine — a gap none of them fill.
- Procore: large enterprise tool. BuildFlow is designed for the small contractor Procore is too expensive for.

CURRENT STATUS:
- Pre-revenue beta, actively enrolling design partners
- Design partners get: free access during beta + direct influence on product roadmap
- No credit card required for trial
- Founder is personally doing onboarding calls for all early users

COMMON QUESTIONS & HOW TO ANSWER THEM:

Q: How does BuildFlow work?
A: Explain the 5-step workflow above clearly and concisely. Emphasize speed (5 seconds to parse a blueprint) and the time savings.

Q: What does it cost / pricing?
A: $75 per project to start, or $400/month for unlimited. Always mention the 7-day free trial. Emphasize the ROI.

Q: Is there a free trial?
A: Yes — 7 days free, no credit card required. They can try it on a real project.

Q: How accurate is the blueprint parsing?
A: 90%+ accuracy on standard blueprint formats using GPT-4o Vision. For the first 10 projects with a new customer, there's a human review step built in. Contractors can also edit any extracted items before proceeding.

Q: What kinds of blueprints can it read?
A: Any standard PDF blueprint or project specification, up to 50MB. Works on residential, commercial, and specialty trade blueprints.

Q: Is it hard to set up?
A: No. Upload a blueprint and the system handles the rest. No IT setup, no integrations required to start. Onboarding call included for all trial users.

Q: What if my subcontractors don't respond to the automated emails?
A: BuildFlow sends automated follow-up reminders at 48 hours and 24 hours before the deadline. If they still don't respond, you get an alert. The system makes it easy to re-send or manually mark a bid as received.

Q: Does it integrate with Procore / QuickBooks / other tools?
A: Google Sheets integration is live. QuickBooks, HubSpot, and other integrations are on the Phase 2 roadmap (months 4–6). The schedule output exports to CSV and PDF today.

Q: How is this different from just using email?
A: Email doesn't track anything automatically. With BuildFlow, every bid request is logged, every response is tracked, every deadline is monitored — without you checking your inbox constantly.

Q: Is my data secure / private?
A: Blueprint data is stored securely on AWS S3 with encryption. It is never shared with third parties or used to train AI models. Each contractor's data is completely isolated.

Q: What size contractor is this for?
A: Best fit is 5–50 employees. Owner-operators save the most time because they're currently doing everything manually. Multi-PM operations benefit from centralized visibility across all projects.

Q: I'm skeptical — how do I know it will actually work?
A: That's fair. The best answer is to try it on one real project — 7 days free, no credit card. If it doesn't save you time, you don't pay anything. The founder is also doing personal onboarding calls for all early users.

Q: Can I cancel anytime?
A: Yes. No contracts, no cancellation fees. Monthly plan can be cancelled any time.

Q: How do I sign up / get started?
A: Direct them to the free trial. Tell them to enter their email in the waitlist form on the page, or email hello@msystemsai.com. The founder will reach out personally to set up an onboarding call.

Q: Who built this?
A: BuildFlow AI was built by a University of Kansas student building an AI startup while in college. The founder is doing all early sales and onboarding personally.

Q: Is this just for general contractors or also for specialty subs?
A: Both. GCs use it to send and track outgoing bid requests to their subs. Specialty subs (electrical, plumbing, framing, roofing, etc.) use it to track incoming bid requests from GCs and never miss a deadline.

Q: What is a design partner?
A: A design partner is an early contractor who gets free beta access in exchange for giving feedback on the product. You shape the roadmap, lock in founder pricing forever, and get white-glove onboarding. Spots are limited.

Q: What happens after the free trial?
A: After 7 days you can choose $75/project or $400/month. If you loved it, you stay. If not, you walk away — no charge, no hard feelings.

Q: Do I need to install anything?
A: No. BuildFlow is 100% web-based. Works in any browser. No downloads, no IT involvement needed.

Q: How long does it take to process a blueprint?
A: Under 5 seconds for most blueprints. Even large 40–50 page sets are processed in under 30 seconds.

Q: What if the AI makes a mistake on the blueprint?
A: Every extraction goes through a contractor review step before anything is sent. You see every line item, can edit or remove anything, and only proceed when you're happy with it.

Q: Can I use it for multiple projects at once?
A: Yes. The dashboard shows all active projects and their bid status in one view. You can run as many projects simultaneously as you need.

Q: What happens to my blueprint data?
A: Blueprints are stored on AWS S3 with encryption. They are never shared with anyone, never used to train AI, and you can delete them anytime.

Q: Is there a hybrid plan?
A: Yes — $200/month base + $25/project, capped at 20 projects. Good for contractors who run a lot of projects and want more flexibility than the flat $400/month.

Q: Is there an annual discount?
A: Yes — $3,840/year, which saves you 2 months compared to paying monthly ($4,800/year).

Q: Who built this?
A: BuildFlow AI was built by a University of Kansas student building an AI startup while in college. The founder is doing all early sales and onboarding personally.

Q: Can I cancel anytime?
A: Yes. No contracts, no cancellation fees. Monthly plan can be cancelled any time.

COMPETITIVE ADVANTAGE vs. others:
- Togal.AI: focuses on AI takeoffs/measurements. BuildFlow focuses on scheduling, not just measurements.
- Downtobid: bid invitation and sub management at ~$150/mo. BuildFlow automates schedule creation FROM the bid.
- Buildr: CRM and precon management, custom/enterprise pricing. BuildFlow is more accessible at $75/project.
- STACK: cloud estimating. BuildFlow is specifically the "bid-to-schedule" AI engine — a gap none of them fill.
- Procore: large enterprise tool. BuildFlow is designed for the small contractor Procore is too expensive for.

TONE GUIDELINES:
- Be conversational, not corporate
- Use "you" not "our users"
- Short sentences. Real talk.
- If someone expresses frustration or skepticism, acknowledge it genuinely before answering
- If someone asks to sign up or get started, give them the clear next step: enter email on the page or email hello@msystemsai.com
- If someone asks something you don't know, say so honestly and offer to connect them with the founder
- Never make up features or pricing that aren't in this document
- If asked about things outside BuildFlow (competitor features, unrelated tech), answer briefly and redirect back to how BuildFlow handles it
- If someone mentions their trade or company size, tailor your answer to their situation

Always end responses with a relevant follow-up question or a nudge toward the free trial when appropriate — but don't be annoying about it.`;

// ── STATE ────────────────────────────────────────────────────────────────
let conversationHistory = [];
let isTyping = false;

// ── INIT ─────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  addBotMessage("Hey! 👋 I'm the BuildFlow AI assistant. I can answer any question about how the product works, pricing, setup — whatever's on your mind.\n\nWhat would you like to know?");
  setupInput();
});

function setupInput() {
  const input = document.getElementById('chat-input');
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
}

// ── SEND MESSAGE ──────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || isTyping) return;

  input.value = '';
  input.style.height = 'auto';
  hideQuickReplies();

  addUserMessage(text);
  conversationHistory.push({ role: 'user', content: text });

  showTyping();
  setSendDisabled(true);

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    hideTyping();

    if (data.content && data.content[0] && data.content[0].text) {
      const reply = data.content[0].text;
      conversationHistory.push({ role: 'assistant', content: reply });
      addBotMessage(reply);
    } else if (data.error) {
      addBotMessage("I'm having a quick technical hiccup. You can reach us directly at **hello@msystemsai.com** — we'll get back to you fast.");
    }
  } catch (err) {
    hideTyping();
    addBotMessage("Looks like there's a connection issue on my end. You can always reach the team directly at **hello@msystemsai.com** — or drop your email in the form above and we'll follow up.");
  }

  setSendDisabled(false);
  document.getElementById('chat-input').focus();
}

function sendQuick(text) {
  document.getElementById('chat-input').value = text;
  sendMessage();
}

// ── MESSAGE RENDERING ─────────────────────────────────────────────────────
function addBotMessage(text) {
  const messages = document.getElementById('chat-messages');
  const now = getTime();

  const group = document.createElement('div');
  group.className = 'msg-group bot';

  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar bot';
  avatarEl.textContent = 'BF';

  const right = document.createElement('div');

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = renderMarkdown(text);

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = now;

  right.appendChild(bubble);
  right.appendChild(time);
  group.appendChild(avatarEl);
  group.appendChild(right);
  messages.appendChild(group);
  scrollToBottom();
}

function addUserMessage(text) {
  const messages = document.getElementById('chat-messages');
  const now = getTime();

  const group = document.createElement('div');
  group.className = 'msg-group user';

  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar user';
  avatarEl.textContent = 'You';

  const left = document.createElement('div');

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = now;

  left.appendChild(bubble);
  left.appendChild(time);
  group.appendChild(left);
  group.appendChild(avatarEl);
  messages.appendChild(group);
  scrollToBottom();
}

// ── TYPING INDICATOR ──────────────────────────────────────────────────────
function showTyping() {
  isTyping = true;
  const messages = document.getElementById('chat-messages');
  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  indicator.id = 'typing-indicator';

  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar bot';
  avatarEl.textContent = 'BF';

  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';

  indicator.appendChild(avatarEl);
  indicator.appendChild(dots);
  messages.appendChild(indicator);
  scrollToBottom();
}

function hideTyping() {
  isTyping = false;
  const indicator = document.getElementById('typing-indicator');
  if (indicator) indicator.remove();
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function scrollToBottom() {
  const messages = document.getElementById('chat-messages');
  messages.scrollTop = messages.scrollHeight;
}

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function setSendDisabled(disabled) {
  document.getElementById('send-btn').disabled = disabled;
}

function hideQuickReplies() {
  const qr = document.getElementById('quick-replies');
  if (qr && conversationHistory.length > 0) {
    qr.style.display = 'none';
  }
}

function clearChat() {
  conversationHistory = [];
  document.getElementById('chat-messages').innerHTML = '';
  const qr = document.getElementById('quick-replies');
  if (qr) qr.style.display = 'flex';
  addBotMessage("Chat cleared! Ask me anything about BuildFlow AI — pricing, how it works, setup, whatever you need.");
}

// ── MARKDOWN RENDERER ─────────────────────────────────────────────────────
function renderMarkdown(text) {
  return text
    // Bold
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    // Italic
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    // Code
    .replace(/`(.*?)`/g, '<code>$1</code>')
    // Bullet lists
    .replace(/^[-•]\s(.+)$/gm, '<li>$1</li>')
    // Numbered lists
    .replace(/^\d+\.\s(.+)$/gm, '<li>$1</li>')
    // Wrap consecutive <li> items
    .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
    // Double newlines = paragraphs
    .replace(/\n\n/g, '</p><p>')
    // Single newlines within paragraphs
    .replace(/\n/g, '<br/>')
    // Wrap in paragraph
    .replace(/^(.+)$/, '<p>$1</p>');
}
</script>
