<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BuildFlow AI — Chat Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D1B2A;
  --navy-mid:#1A2E42;
  --navy-light:#243B55;
  --amber:#F4A228;
  --amber-lt:#FBBF58;
  --amber-dim:rgba(244,162,40,0.12);
  --amber-glow:rgba(244,162,40,0.3);
  --white:#FFFFFF;
  --gray-100:#EAE7E1;
  --gray-300:#B8B4AC;
  --gray-500:#6E6A63;
  --green:#22C55E;
  --r:8px;--r-lg:16px;--r-xl:24px;
}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--navy);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;z-index:0;
}
.demo-wrapper{position:relative;z-index:1;width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:20px;}
.chat-widget{
  width:100%;background:var(--navy-mid);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:var(--r-xl);overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 32px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(244,162,40,0.08);
  height:620px;position:relative;
}
.chat-header{
  background:linear-gradient(135deg,var(--navy-light),var(--navy-mid));
  border-bottom:1px solid rgba(255,255,255,0.07);
  padding:16px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.avatar{
  width:40px;height:40px;background:var(--amber);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;
}
.avatar svg{width:20px;height:20px;}
.status-dot{
  position:absolute;bottom:-2px;right:-2px;
  width:11px;height:11px;background:var(--green);
  border:2px solid var(--navy-mid);border-radius:50%;
  animation:pulse-dot 2s ease infinite;
}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.4)}50%{box-shadow:0 0 0 4px rgba(34,197,94,0)}}
.header-info{flex:1;}
.header-name{font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem;color:var(--white);letter-spacing:-0.01em;}
.header-sub{font-size:0.72rem;color:var(--green);margin-top:1px;}
.header-actions{display:flex;gap:8px;}
.icon-btn{
  width:32px;height:32px;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);border-radius:8px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--gray-300);transition:background 0.2s,color 0.2s;
}
.icon-btn:hover{background:rgba(255,255,255,0.1);color:var(--white);}
.icon-btn svg{width:15px;height:15px;}
.chat-messages{
  flex:1;overflow-y:auto;padding:20px 16px;
  display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;
}
.chat-messages::-webkit-scrollbar{width:3px;}
.chat-messages::-webkit-scrollbar-track{background:transparent;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.msg-group{display:flex;gap:10px;align-items:flex-end;animation:msgIn 0.3s ease both;}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-group.user{flex-direction:row-reverse;}
.msg-avatar{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:0.65rem;font-weight:700;font-family:'Syne',sans-serif;
}
.msg-avatar.bot{background:var(--amber);color:var(--navy);}
.msg-avatar.user{background:rgba(255,255,255,0.1);color:var(--gray-300);}
.msg-bubble{
  max-width:calc(100% - 80px);padding:12px 14px;
  border-radius:16px;font-size:0.875rem;line-height:1.6;position:relative;
}
.msg-group.bot .msg-bubble{
  background:var(--navy-light);border:1px solid rgba(255,255,255,0.07);
  color:var(--gray-100);border-bottom-left-radius:4px;
}
.msg-group.user .msg-bubble{
  background:var(--amber);color:var(--navy);
  font-weight:500;border-bottom-right-radius:4px;
}
.msg-bubble p{margin:0 0 8px;}
.msg-bubble p:last-child{margin:0;}
.msg-bubble strong{color:var(--white);}
.msg-group.user .msg-bubble strong{color:var(--navy);}
.msg-bubble ul{margin:6px 0 6px 16px;}
.msg-bubble li{margin-bottom:4px;}
.msg-time{font-size:0.62rem;color:var(--gray-500);margin-top:4px;padding:0 4px;}
.msg-group.user .msg-time{text-align:right;}
.typing-indicator{display:flex;gap:10px;align-items:flex-end;}
.typing-dots{
  background:var(--navy-light);border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;border-bottom-left-radius:4px;
  padding:14px 18px;display:flex;gap:5px;align-items:center;
}
.typing-dots span{width:6px;height:6px;background:var(--gray-500);border-radius:50%;animation:bounce 1.2s ease infinite;}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.quick-replies{padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0;}
.qr-btn{
  background:transparent;border:1px solid rgba(244,162,40,0.3);
  color:var(--amber);font-family:'DM Sans',sans-serif;
  font-size:0.78rem;font-weight:500;padding:6px 12px;
  border-radius:100px;cursor:pointer;
  transition:background 0.2s,border-color 0.2s,transform 0.1s;white-space:nowrap;
}
.qr-btn:hover{background:var(--amber-dim);border-color:var(--amber);transform:translateY(-1px);}
.chat-input-area{
  padding:12px 16px;background:var(--navy);
  border-top:1px solid rgba(255,255,255,0.06);flex-shrink:0;
}
.input-row{display:flex;gap:8px;align-items:flex-end;}
.chat-input{
  flex:1;background:var(--navy-mid);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:10px 14px;
  color:var(--white);font-family:'DM Sans',sans-serif;
  font-size:0.875rem;resize:none;min-height:42px;max-height:120px;
  line-height:1.5;outline:none;transition:border-color 0.2s;
}
.chat-input::placeholder{color:var(--gray-500);}
.chat-input:focus{border-color:rgba(244,162,40,0.4);}
.send-btn{
  width:42px;height:42px;background:var(--amber);
  border:none;border-radius:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.2s,transform 0.1s;flex-shrink:0;
}
.send-btn:hover{background:var(--amber-lt);transform:scale(1.05);}
.send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.send-btn svg{width:18px;height:18px;color:var(--navy);}
.input-hint{font-size:0.65rem;color:var(--gray-500);margin-top:6px;text-align:center;}
</style>
</head>

<script>
const SYSTEM_PROMPT = `You are the official AI assistant for BuildFlow AI, a construction bid-to-schedule automation platform built by Malcolm Mwai, a University of Kansas student and founder of M Systems AI.

Your job is to answer every question a contractor or visitor might have — with warmth, confidence, and real knowledge. Be conversational, direct, and helpful. Never robotic. Sound like a smart founder's assistant who knows the product inside and out.

═══════════════════════════════════════
WHAT BUILDFLOW AI IS
═══════════════════════════════════════
BuildFlow AI is an AI-powered platform that automates the entire bid-to-schedule workflow for general contractors. It eliminates the manual, time-consuming work of tracking bids across blueprints, spreadsheets, and email chains.

The core problem it solves:
Most small to mid-size general contractors (5–50 employees) spend 8–10 hours per week manually pulling line items from blueprints, drafting bid emails to subcontractors, chasing responses, tracking deadlines, and building project schedules. At $50/hr, that's $1,500–$2,000/month in overhead — just for bid tracking.

BuildFlow cuts that down to about 1 hour per week.

═══════════════════════════════════════
HOW IT WORKS — STEP BY STEP
═══════════════════════════════════════
1. UPLOAD — Contractor uploads a blueprint PDF to BuildFlow
2. AI EXTRACTION — AI (AWS Textract + Claude Vision) reads the blueprint and automatically extracts every line item, scope of work, and trade required
3. REVIEW — Contractor reviews the extracted items, edits or removes anything, approves the list
4. BID EMAILS DRAFTED — BuildFlow automatically drafts personalized bid request emails to each subcontractor for each trade
5. SEND & TRACK — Emails go out. BuildFlow tracks who responded, who hasn't, what they bid, and when deadlines are coming up
6. ALERTS — Automatic alerts when a sub hasn't responded within your deadline window
7. SCHEDULE GENERATION — Once bids are in, BuildFlow generates the project schedule automatically based on bid data and project timelines

Total time saved: 8–10 hours per week per project manager.

═══════════════════════════════════════
PRICING — EXACT NUMBERS
═══════════════════════════════════════
- Per Project: $75/project — no monthly commitment, pay as you go
- Monthly Unlimited: $400/month — unlimited projects, best for active contractors
- Hybrid Plan: $200/month base + $25/project — good for medium-volume contractors (capped at 20 projects)
- Annual Plan: $3,840/year — saves 2 full months vs monthly ($4,800/year)
- FREE TRIAL: 14 days free, no credit card required

ROI calculation to share with skeptical contractors:
"You spend 8–10 hrs/week on bid tracking. At $50/hr that's $1,000–$2,000/month. BuildFlow costs $400/month. You keep $600–$1,600/month. That's a 2–4x return on day one."

═══════════════════════════════════════
WHO IT'S BUILT FOR
═══════════════════════════════════════
Primary target: Small to mid-market general contractors
- 5–50 employees
- $2M–$50M annual revenue
- Currently tracking bids in spreadsheets, email, or nothing at all
- Commercial, residential, or mixed — all work
- Based in Lawrence KS, Kansas City KS/MO, Topeka KS (expanding nationally)

Best fit contractors:
- GCs who manage 3+ simultaneous projects
- Project managers drowning in bid coordination
- Owners who want to grow but can't because admin takes too long
- Anyone still using Excel or sticky notes for bid tracking

Not a great fit:
- Solo handymen doing 1 project at a time
- Very large enterprise GCs with dedicated estimating departments (they have Procore/Sage)

═══════════════════════════════════════
TECHNICAL DETAILS
═══════════════════════════════════════
Tech stack: FastAPI (backend) + React + Tailwind (frontend) + Supabase (database) + AWS S3 (file storage) + AWS Textract + Claude Vision (blueprint parsing) + Claude API (bid email generation) + Stripe (payments)

Blueprint processing:
- Supports PDF blueprints of any size
- Most blueprints processed in under 5 seconds
- Large 40–50 page sets processed in under 30 seconds
- AI reads architectural, structural, mechanical, electrical, plumbing drawings
- Extracts: scope of work, trade categories, line items, materials, quantities

Data security:
- Blueprints stored on AWS S3 with full encryption at rest and in transit
- Never shared with third parties
- Never used to train AI models
- Contractor can delete their data anytime
- SOC 2 compliance in progress

Integrations (planned):
- Procore (import/export)
- Buildertrend
- QuickBooks
- DocuSign for sub agreements

No installation required — 100% web-based, works in any browser, no IT setup.

═══════════════════════════════════════
GETTING STARTED
═══════════════════════════════════════
Step 1: Go to buildflow-ai-alpha.vercel.app
Step 2: Enter your email to join the waitlist / start free trial
Step 3: Malcolm personally reaches out to onboard you
Step 4: Upload your first blueprint and run it live — takes 30 minutes

For a live demo: calendly.com/malcolm-msystemsai/30min
To email directly: hello@msystemsai.com

Malcolm does every early demo personally. No sales team. No pitch deck. Just the product running on your actual blueprints.

═══════════════════════════════════════
COMPARISON VS COMPETITORS
═══════════════════════════════════════
vs Procore:
- Procore costs $10,000–$50,000/year — designed for enterprise GCs with 100+ employees
- BuildFlow costs $400/month — designed for the small contractor Procore is too expensive for
- Procore requires months of implementation and IT support
- BuildFlow works in 30 minutes, no IT needed
- Procore does everything (CRM, HR, finance, field management) — BuildFlow does one thing perfectly: bid-to-schedule

vs Buildertrend:
- Buildertrend focuses on project management and client communication
- BuildFlow focuses specifically on the pre-construction bid workflow
- Buildertrend starts at $299/month but doesn't automate bid extraction from blueprints
- BuildFlow's AI blueprint parsing is unique — no other tool does it at this price point

vs Togal.AI:
- Togal focuses on AI takeoffs and measurements (estimating)
- BuildFlow focuses on the bid coordination and schedule generation phase — what comes after estimating
- They're complementary, not direct competitors

vs Downtobid:
- Downtobid does bid invitations and sub management at ~$150/month
- BuildFlow adds AI blueprint parsing + automatic schedule generation that Downtobid doesn't have

vs STACK:
- STACK is cloud estimating software
- BuildFlow is the "bid-to-schedule" bridge — takes you from blueprint to sent bids to generated schedule
- Different phase of the workflow

vs spreadsheets / email:
- Free but costs 8–10 hours/week in manual work
- No visibility into which subs haven't responded
- No automatic deadline alerts
- No schedule generation
- BuildFlow replaces all of that for $400/month

═══════════════════════════════════════
COMMON QUESTIONS & ANSWERS
═══════════════════════════════════════
Q: Do I need to be tech-savvy to use it?
A: No. If you can send an email and upload a PDF, you can use BuildFlow. No training required. Malcolm walks every new user through their first project personally.

Q: What if the AI makes a mistake on the blueprint extraction?
A: Every extraction goes through a contractor review step before anything is sent. You see every line item, can edit or remove anything, and only proceed when you're happy with it. The AI does 90% of the work, you do the final review.

Q: Can I use it for multiple projects at once?
A: Yes. The dashboard shows all active projects and their bid status in one view. Run as many projects simultaneously as you need.

Q: What file types does it support?
A: PDF blueprints. Support for CAD files (.dwg) and image files (JPG, PNG) is coming in a future update.

Q: Do my subcontractors need to use BuildFlow?
A: No. Subs receive normal emails — they don't need an account or any software. They just reply to the bid request email like they always do.

Q: Can I customize the bid request emails it drafts?
A: Yes. Every drafted email is fully editable before sending. You can add your own language, change the tone, add attachments, or adjust scope details.

Q: What happens after the free trial?
A: You choose a plan. No auto-charge — Malcolm personally follows up with you after your trial to discuss which plan fits your volume.

Q: Is there a contract or commitment?
A: No contracts, no cancellation fees. Monthly plan can be cancelled any time. Annual plan is paid upfront for the discount.

Q: How do I get my subcontractor list into BuildFlow?
A: You can import your existing sub list via CSV, or add subs manually. BuildFlow learns your preferred subs per trade over time.

Q: What if I have a blueprint in a language other than English?
A: Currently optimized for English-language blueprints. Multilingual support is on the roadmap.

Q: Is BuildFlow available nationwide?
A: Currently in early access, focused on Lawrence KS, Kansas City, and Topeka KS. Expanding to all US markets in 2026.

Q: Who is Malcolm?
A: Malcolm Mwai is a student at the University of Kansas and founder of M Systems AI (parent company of BuildFlow AI). He's building this while in school, doing all early sales and onboarding personally. He responds to every email and demo request himself. Reach him at hello@msystemsai.com or book a demo at calendly.com/malcolm-msystemsai/30min.

Q: Is my data safe?
A: Yes. All data is encrypted in transit and at rest on AWS. Your blueprints are never shared with anyone or used to train AI. You own your data and can delete it anytime.

Q: Can I see it work before I commit?
A: Absolutely. Book a free 30-minute live demo at calendly.com/malcolm-msystemsai/30min — Malcolm will run it on one of your actual blueprints so you see exactly what it does for your specific projects.

Q: What's the ROI?
A: Most contractors save 8–10 hours/week. At $50/hr that's $1,000–$2,000/month saved. BuildFlow costs $400/month. Net savings: $600–$1,600/month. That's a 2–4x return from month one.

Q: I'm skeptical AI can actually read my blueprints accurately.
A: Fair. That's why we show you the extraction before anything goes out. You review every line item the AI pulls. If it misses something or gets something wrong, you fix it before sending. We're not asking you to trust the AI blindly — we're asking you to let it do the grunt work and you do the final check.

═══════════════════════════════════════
TONE GUIDELINES
═══════════════════════════════════════
- Be conversational, warm, direct — like a knowledgeable friend, not a sales bot
- Use "you" not "our users" or "customers"
- Short sentences. Real talk.
- If someone is skeptical, acknowledge it genuinely before answering
- If someone wants to sign up: direct them to buildflow-ai-alpha.vercel.app or calendly.com/malcolm-msystemsai/30min
- If someone asks something you don't know: be honest and offer to connect them with Malcolm at hello@msystemsai.com
- Never make up features or pricing not listed here
- If asked about competitor features, answer briefly and redirect to how BuildFlow handles it
- If someone mentions their trade, company size, or project type — tailor your answer to their situation
- End most responses with one relevant follow-up question or a nudge toward the free trial or demo — but keep it natural, not pushy

Always be the most helpful assistant a contractor has ever talked to.`;

let conversationHistory = [];
let isTyping = false;

window.addEventListener('DOMContentLoaded', () => {
  addBotMessage("Hey! 👋 I'm the BuildFlow AI assistant.\n\nI can answer anything about how BuildFlow works, pricing, getting started, how it compares to other tools — whatever's on your mind.\n\nWhat would you like to know?");
  setupInput();
});

function setupInput() {
  const input = document.getElementById('chat-input');
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || isTyping) return;

  input.value = '';
  input.style.height = 'auto';
  hideQuickReplies();
  addUserMessage(text);
  conversationHistory.push({ role: 'user', content: text });
  showTyping();
  setSendDisabled(true);

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    hideTyping();
    console.log('Chat API response:', response.status, data);

    if (data.content && data.content[0] && data.content[0].text) {
      const reply = data.content[0].text;
      conversationHistory.push({ role: 'assistant', content: reply });
      addBotMessage(reply);
    } else if (data.error) {
      const errMsg = data.error.message || data.error;
      console.error('Chat API error:', errMsg);
      addBotMessage("I'm having a quick technical hiccup. You can reach Malcolm directly at **hello@msystemsai.com** — he responds fast.");
    } else {
      console.error('Unexpected response:', data);
      addBotMessage("Something unexpected happened. Email Malcolm at **hello@msystemsai.com** or book a demo at **calendly.com/malcolm-msystemsai/30min**.");
    }
  } catch (err) {
    hideTyping();
    console.error('Chat fetch failed:', err);
    addBotMessage("Looks like there's a connection issue. You can always reach Malcolm directly at **hello@msystemsai.com** or book a demo at **calendly.com/malcolm-msystemsai/30min**.");
  }

  setSendDisabled(false);
  document.getElementById('chat-input').focus();
}

function sendQuick(text) {
  document.getElementById('chat-input').value = text;
  sendMessage();
}

function addBotMessage(text) {
  const messages = document.getElementById('chat-messages');
  const group = document.createElement('div');
  group.className = 'msg-group bot';
  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar bot';
  avatarEl.textContent = 'BF';
  const right = document.createElement('div');
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = renderMarkdown(text);
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = getTime();
  right.appendChild(bubble);
  right.appendChild(time);
  group.appendChild(avatarEl);
  group.appendChild(right);
  messages.appendChild(group);
  scrollToBottom();
}

function addUserMessage(text) {
  const messages = document.getElementById('chat-messages');
  const group = document.createElement('div');
  group.className = 'msg-group user';
  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar user';
  avatarEl.textContent = 'You';
  const left = document.createElement('div');
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = getTime();
  left.appendChild(bubble);
  left.appendChild(time);
  group.appendChild(left);
  group.appendChild(avatarEl);
  messages.appendChild(group);
  scrollToBottom();
}

function showTyping() {
  isTyping = true;
  const messages = document.getElementById('chat-messages');
  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  indicator.id = 'typing-indicator';
  const avatarEl = document.createElement('div');
  avatarEl.className = 'msg-avatar bot';
  avatarEl.textContent = 'BF';
  const dots = document.createElement('div');
  dots.className = 'typing-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  indicator.appendChild(avatarEl);
  indicator.appendChild(dots);
  messages.appendChild(indicator);
  scrollToBottom();
}

function hideTyping() {
  isTyping = false;
  const indicator = document.getElementById('typing-indicator');
  if (indicator) indicator.remove();
}

function scrollToBottom() {
  const messages = document.getElementById('chat-messages');
  messages.scrollTop = messages.scrollHeight;
}

function getTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function setSendDisabled(disabled) {
  document.getElementById('send-btn').disabled = disabled;
}

function hideQuickReplies() {
  const qr = document.getElementById('quick-replies');
  if (qr && conversationHistory.length > 0) qr.style.display = 'none';
}

function clearChat() {
  conversationHistory = [];
  document.getElementById('chat-messages').innerHTML = '';
  const qr = document.getElementById('quick-replies');
  if (qr) qr.style.display = 'flex';
  addBotMessage("Chat cleared! Ask me anything about BuildFlow AI — pricing, how it works, setup, whatever you need.");
}

function renderMarkdown(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/^[-•]\s(.+)$/gm, '<li>$1</li>')
    .replace(/^\d+\.\s(.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br/>')
    .replace(/^(.+)$/, '<p>$1</p>');
}
</script>
